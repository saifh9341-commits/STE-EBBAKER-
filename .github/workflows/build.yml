name: Build FinCore ERP Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Workspace
      run: |
        Expand-Archive -Path FinCoreERP_Enhanced_Workspace.zip -DestinationPath . -Force

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build Project with CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        cmake --build . --config Release

    - name: Deploy Qt Libraries
      run: |
        windeployqt --release build/Release/FinCoreERP.exe

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FinCoreERP-Windows-Release
        path: build/Release/
        
